<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Girly 🌸 · Cycle Assistant</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <link rel="stylesheet" href="css/girly.css"/>
</head>
<body>
<main class="page" style="gap:var(--sp-md); max-width:600px">

  <!-- Context & privacy shield -->
  <div class="card-flat" style="position:relative; overflow:hidden">
    <div style="position:absolute; right:-2rem; top:-2rem; width:7rem; height:7rem; border-radius:50%; background:color-mix(in srgb, var(--primary-fixed) 40%, transparent); filter:blur(24px)"></div>
    <div class="stack gap-xs" style="position:relative">
      <div class="row-between" style="gap:var(--sp-xs)">
        <div class="row gap-xs" style="min-width:0">
          <span class="material-symbols-outlined filled" style="color:var(--primary); font-size:20px">spa</span>
          <span class="t-label-lg" id="ctx-label" style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap">Loading…</span>
        </div>
        <span class="pill pill-lilac">Active Context</span>
      </div>
      <div class="row gap-xs muted t-body-sm">
        <span class="material-symbols-outlined" style="font-size:15px; color:var(--tertiary)">lock</span>
        <span>Private &amp; Confidential · Zero health logs shared or leaked</span>
      </div>
    </div>
  </div>

  <!-- Chat stream -->
  <div class="chat-stream" id="chat-stream"></div>

  <!-- Suggested prompts -->
  <div class="stack gap-xs" style="padding-top:var(--sp-xs)">
    <div class="row gap-xs muted" style="padding-inline:4px">
      <span class="material-symbols-outlined" style="font-size:14px">psychology</span>
      <span class="t-label-sm" id="suggest-label">Suggested questions</span>
    </div>
    <div class="prompt-chips" id="prompt-chips"></div>
  </div>

  <!-- Chat dock -->
  <div class="chat-dock stack gap-xs">
    <form class="chat-input-row" id="chat-form">
      <button class="icon-btn" type="button" aria-label="Cycle logs attachment"
              style="width:40px;height:40px;background:var(--surface-container-low)" title="Your cycle context is attached automatically">
        <span class="material-symbols-outlined" style="font-size:20px">add_circle</span>
      </button>
      <input class="chat-input" id="chat-input" placeholder="Ask anything about periods, hygiene, or cramps..." autocomplete="off"/>
      <button class="send-btn" id="send-button" type="submit" aria-label="Send message">
        <span class="material-symbols-outlined" style="font-size:20px">send</span>
      </button>
    </form>
    <div class="row" style="justify-content:center; gap:4px; padding-inline:var(--sp-xs); padding-top:2px">
      <span class="material-symbols-outlined" style="color:var(--outline); font-size:14px">shield</span>
      <span class="t-label-sm" style="color:var(--outline)">Girly provides educational insights and is not a medical diagnosis.</span>
    </div>
  </div>
</main>

<div class="toast" role="status"></div>
<script src="js/api.js"></script>
<script src="js/assistant.js"></script>
</body>
</html>
