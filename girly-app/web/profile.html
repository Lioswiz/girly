<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Girly 🌸 · Profile</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <link rel="stylesheet" href="css/girly.css"/>
</head>
<body>
<main class="page" style="max-width:640px">
  <section class="card stack gap-md">
    <div class="row-between">
      <div>
        <span class="pill pill-lilac">Your account</span>
        <h1 class="t-headline-lg" style="margin:.5rem 0 0">Profile</h1>
        <p class="t-body-sm muted" style="margin:4px 0 0">Update your personal details and profile picture.</p>
      </div>
      <span class="material-symbols-outlined" style="font-size:32px;color:var(--primary)">account_circle</span>
    </div>

    <div class="stack gap-sm" style="align-items:center;padding-block:var(--sp-sm)">
      <div id="profile-preview" class="avatar" style="width:96px;height:96px;font-size:28px" aria-label="Profile picture">G</div>
      <div class="row" style="gap:var(--sp-xs)">
        <label class="btn btn-soft" for="profile-picture-input" style="cursor:pointer">
          <span class="material-symbols-outlined" style="font-size:18px">add_a_photo</span>
          <span>Add picture</span>
        </label>
        <button class="btn btn-ghost" id="remove-picture" type="button">
          <span class="material-symbols-outlined" style="font-size:18px">delete</span>
          <span>Remove</span>
        </button>
      </div>
      <input id="profile-picture-input" type="file" accept="image/png,image/jpeg,image/webp" hidden/>
    </div>

    <form id="profile-form" class="stack gap-md">
      <div class="field">
        <label for="profile-name">Full name</label>
        <input class="input" id="profile-name" required maxlength="120" type="text"/>
      </div>
      <div class="field">
        <label for="profile-email">Email address</label>
        <input class="input" id="profile-email" disabled type="email"/>
      </div>
      <div class="field">
        <label for="profile-dob">Date of birth</label>
        <input class="input" id="profile-dob" required type="date"/>
      </div>
      <div class="field">
        <label for="profile-sex">Biological sex</label>
        <select class="input" id="profile-sex">
          <option value="female">Female</option>
          <option value="male">Male</option>
          <option value="intersex">Intersex</option>
          <option value="prefer_not_to_say">Prefer not to say</option>
        </select>
      </div>
      <div class="field">
        <label for="profile-period-length">Typical period length</label>
        <div class="row" style="gap:var(--sp-sm)">
          <input id="profile-period-length" min="3" max="7" type="range" style="flex:1"/>
          <span class="pill pill-blush" id="profile-period-value">5 days</span>
        </div>
      </div>
      <p id="profile-error" class="t-body-sm" style="color:var(--error);margin:0"></p>
      <button class="btn btn-primary btn-block" id="save-profile" type="submit">
        <span class="material-symbols-outlined" style="font-size:18px">save</span>
        <span>Save profile</span>
      </button>
    </form>
  </section>
</main>
<div class="toast" role="status"></div>
<script src="js/api.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
